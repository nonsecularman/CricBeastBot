services:
  bot:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./data:/app/data
    depends_on:
      db:
        condition: service_healthy
        required: false

  # Optional - only needed if DATABASE_URL in .env points at this service.
  # For a small/medium bot, SQLite (the default) needs no separate service.
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: cricbeast
      POSTGRES_PASSWORD: cricbeast
      POSTGRES_DB: cricbeast
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cricbeast"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
